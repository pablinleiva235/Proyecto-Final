site_name: "Reautomatización Aura 1000"
use_directory_urls: false

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.expand

nav:
  - Inicio: index.md
  - Arquitectura:
      - Estructura: arquitectura/carpetas.md
      - Punto de entrada: main.md
  - Configuración:
      - Índice: config/index.md
      - Señales digitales: config/digital_signals.md
      - Señales analógicas: config/analog_signals.md
  - Drivers:
      - Índice: drivers/index.md
      - Digital: drivers/digital.md
      - Analógico: drivers/analogico.md
  - GUI:
      - Índice: gui/index.md
      - MainWindow: gui/main_window.md
      - Pantallas y widgets: gui/pantallas.md
      - Integración y señales: gui/integracion.md
      - UI heredada: gui/pyqt_gui.md
  - Control y lógica:
      - Índice: logic/index.md
      - Secuencias:
          - Arranque: logic/startup_sequence.md
          - Puerta: logic/door_sequence.md
          - Soft Vacuum: logic/soft_vacuum_sequence.md
          - Main Vacuum: logic/main_vacuum_sequence.md
          - Venteo: logic/vent_sequence.md
          - Apagado seguro: logic/shutdown_sequence.md
          - Recetas: logic/recipe_sequence.md
      - Sondeo de controladores: logic/sondeo_controladores.md
      - Monitoreo de fallas: logic/fallas_proceso.md
      - Mantenimiento heredado: logic/maintenance_process.md
      - Actualización analógica heredada: logic/analog_update.md
  - Servicios:
      - Índice: services/index.md
      - Hardware: services/hardware.md
      - Estado legado: services/system_state.md
  - Mantenimiento documental:
      - ADRs: ADRs.md
      - Pendientes: GuiToDo.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
